[project]
name = "market-brief"
version = "1.0.0"
description = "A stateless Taiwan stock dashboard for Google Cloud Run"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
