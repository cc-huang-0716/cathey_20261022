name: Test and deploy Market Brief

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-brief-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend DOM behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:frontend

  test:
    name: Python tests and container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q
      - name: Build Linux container
        run: docker build --tag market-brief:ci .
      - name: Smoke test real container (without third-party dependency)
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name market-brief-smoke --publish 8080:8080 market-brief:ci
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent http://127.0.0.1:8080/openapi.json > /dev/null
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs market-brief-smoke || true
          docker rm --force market-brief-smoke || true

  infrastructure:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  deploy:
    name: Publish to Google Cloud Run
    needs: [test, frontend, infrastructure]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with short-lived GitHub OIDC identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build, push and deploy immutable image
        shell: bash
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Missing GCP_PROJECT_ID}"
          : "${GCP_REGION:?Missing GCP_REGION}"
          : "${GCP_AR_REPOSITORY:?Missing GCP_AR_REPOSITORY}"
          : "${CLOUD_RUN_SERVICE:?Missing CLOUD_RUN_SERVICE}"
          registry="${GCP_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID}/${GCP_AR_REPOSITORY}/market-brief:${GITHUB_SHA}"
          gcloud auth configure-docker "$registry" --quiet
          # A workflow rerun reuses an already-published immutable commit tag.
          if ! gcloud artifacts docker images describe "$image" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            docker build --tag "$image" .
            docker push "$image"
          fi
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --image "$image" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --quiet
      - name: Verify deployed service
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')"
          curl --fail --silent --retry 5 --retry-delay 3 "${url}/health"
          curl --fail --silent "${url}/openapi.json" > /dev/null
          printf '### Market Brief\n\nDeployed to: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
