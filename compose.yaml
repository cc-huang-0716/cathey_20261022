services:
  market-brief:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-300}"
      HISTORY_CACHE_TTL_SECONDS: "${HISTORY_CACHE_TTL_SECONDS:-900}"
      MAX_STALE_SECONDS: "${MAX_STALE_SECONDS:-3600}"
      UPSTREAM_TIMEOUT_SECONDS: "${UPSTREAM_TIMEOUT_SECONDS:-12}"
      UPSTREAM_FAILURE_BACKOFF_SECONDS: "${UPSTREAM_FAILURE_BACKOFF_SECONDS:-30}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
